<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="0.5" stop-color="#15101C"/>
      <stop offset="1" stop-color="#0C181A"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E8A838"/>
      <stop offset="1" stop-color="#2DD4BF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.4" r="0.5">
      <stop stop-color="#E8A838" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#E8A838" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>
  <ellipse cx="300" cy="160" rx="280" ry="160" fill="url(#glow)"/>
  <!-- Film strip motif -->
  <g opacity="0.15">
    <rect x="80" y="80" width="60" height="240" rx="4" stroke="#F5F0E8" stroke-width="2"/>
    <rect x="92" y="100" width="36" height="28" fill="#F5F0E8" opacity="0.4"/>
    <rect x="92" y="148" width="36" height="28" fill="#F5F0E8" opacity="0.4"/>
    <rect x="92" y="196" width="36" height="28" fill="#F5F0E8" opacity="0.4"/>
    <rect x="92" y="244" width="36" height="28" fill="#F5F0E8" opacity="0.4"/>
  </g>
  <path d="M200 320 C400 200, 700 280, 1000 120" stroke="url(#line)" stroke-width="2" stroke-dasharray="8 12" opacity="0.6"/>
  <circle cx="1000" cy="120" r="6" fill="#E8A838"/>
  <text x="200" y="200" font-family="Syne, Arial Black, sans-serif" font-size="64" font-weight="800" fill="#F5F0E8">Cine</text>
  <text x="360" y="200" font-family="Syne, Arial Black, sans-serif" font-size="64" font-weight="800" fill="#E8A838">fly</text>
  <text x="200" y="245" font-family="Manrope, Arial, sans-serif" font-size="22" fill="#8B95A5">Decole no universo do cinema</text>
  <rect x="200" y="270" width="120" height="4" rx="2" fill="url(#line)"/>
</svg>
